<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{{ alumno.apellido }}, {{ alumno.nombre }} - Infia</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=7">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark shadow-sm sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/dashboard">Infia</a>
      <div class="nav-links">
        <a class="nav-link-item" href="/dashboard">Alumnos</a>
        <a class="nav-link-item" href="/actividades">Actividades</a>
        <a class="nav-link-item" href="/areas">Áreas</a>
        <a class="nav-link-item" href="/unidades">Unidades</a>
        <span class="nav-divider"></span>
        <a class="nav-link-item" href="/perfil">Perfil</a>
        <span class="nav-divider"></span>
        <button class="nav-link-logout" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3" style="max-width:800px">
    <div class="section-header">
      <h6>{{ alumno.apellido }}, {{ alumno.nombre }}</h6>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-primary" id="btnGenerar" onclick="generarInforme({{ alumno.id_alumno }})">
          Generar informe
        </button>
      </div>
    </div>
    <div id="informeContainer">
      <div class="text-center py-4 text-muted">
        <p class="mb-1" style="font-size:2rem">📄</p>
        <p class="small">Presioná "Generar informe" para crear el informe automático.</p>
      </div>
    </div>

    <hr class="my-4">
    <div class="section-header">
      <h6>Actividades realizadas</h6>
      <div class="d-flex gap-2 align-items-center" id="obsActions">
        <button class="btn btn-sm btn-outline-danger d-none" id="btnEliminarTodo" onclick="eliminarTodas()">Eliminar todo</button>
        <button class="btn btn-sm btn-outline-danger d-none" id="btnEliminarSel" onclick="eliminarSeleccionadas()">Eliminar seleccionadas</button>
        <button class="btn btn-sm btn-outline-danger" id="btnSelectMode" onclick="toggleSeleccionObs()">Eliminar</button>
      </div>
    </div>
    <div id="obsContainer">
      <div class="text-center py-5 text-muted">Cargando...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => cargarObsAlumno({{ alumno.id_alumno }}));
  </script>
</body>
</html>
