<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Iniciar Sesión</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=5">
</head>
<body class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="auth-card">
          <div class="card-body">
            <div class="text-center mb-4">
              <div class="auth-brand">Infia</div>
              <p class="auth-subtitle mt-1">Panel del docente</p>
            </div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
              </div>
              <div id="errorMsg" class="alert alert-danger d-none py-2 small"></div>
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div class="text-center mt-3">
              <a href="/forgot" class="text-muted small">¿Olvidaste tu contraseña?</a>
            </div>
            <hr>
            <p class="text-center small mb-0">
              ¿No tenés cuenta? <a href="/registro" class="fw-semibold">Crear cuenta</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=4"></script>
</body>
</html>
