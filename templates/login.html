<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Informes al día, sin estrés | App para docentes</title>
  <meta name="description" content="Infia es la app que necesitás como docente para registrar observaciones, transcribir audio y generar informes de alumnos al instante. Tus informes al día, sin estrés.">
  <meta name="keywords" content="informes docentes, observaciones alumnos, transcripción audio, app profesores, informes escolares, primaria, sala de maestros">
  <meta name="author" content="Infia">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://infia.onrender.com/login">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Infia - Informes al día, sin estrés">
  <meta property="og:description" content="App para docentes: registrá observaciones, transcribí audio y generá informes al instante.">
  <meta property="og:image" content="https://infia.onrender.com/static/icons/iconoinfia-512.png">
  <meta property="og:url" content="https://infia.onrender.com/login">
  <meta property="og:locale" content="es_AR">
  <meta property="og:site_name" content="Infia">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Infia - Informes al día, sin estrés">
  <meta name="twitter:description" content="App para docentes: registrá observaciones, transcribí audio y generá informes al instante.">
  <meta name="twitter:image" content="https://infia.onrender.com/static/icons/iconoinfia-512.png">

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/iconoinfia.png">
  <link rel="icon" type="image/png" href="/static/icons/iconoinfia.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=8">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Infia",
    "url": "https://infia.onrender.com",
    "description": "App para docentes: registrar observaciones, transcribir audio y generar informes de alumnos al instante.",
    "applicationCategory": "EducationalApplication",
    "operatingSystem": "Web",
    "inLanguage": "es",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "ARS"
    }
  }
  </script>
</head>
<body class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="auth-card">
          <div class="card-body">
            <div class="text-center mb-4">
              <img src="/static/icons/iconoinfia.png" alt="Infia" class="auth-logo mb-2">
              <div class="auth-brand">Infia</div>
              <p class="auth-subtitle mt-1">Tus informes al día, sin estrés</p>
            </div>
            <form id="loginForm">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
              </div>
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
              </div>
              <div id="errorMsg" class="alert alert-danger d-none py-2 small"></div>
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div class="text-center mt-3">
              <a href="/forgot" class="text-muted small">¿Olvidaste tu contraseña?</a>
            </div>
            <hr>
            <p class="text-center small mb-0">
              ¿No tenés cuenta? <a href="/registro" class="fw-normal">Crear cuenta</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=5"></script>
</body>
</html>
