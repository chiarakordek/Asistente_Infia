<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Nueva contraseña</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/iconoinfia.png">
  <link rel="icon" type="image/png" href="/static/icons/iconoinfia.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=11">
</head>
<body class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="auth-card">
          <div class="card-body">
            <div class="text-center mb-4">
              <img src="/static/icons/iconoinfia.png" alt="Infia" class="auth-logo mb-2">
              <div class="auth-brand">Infia</div>
              <p class="auth-subtitle mt-1">Crear nueva contraseña</p>
            </div>
            <form id="resetForm">
              <div class="mb-2">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" id="pw1" class="form-control" placeholder="Mín. 8 caracteres" required minlength="8">
              </div>
              <div class="mb-1">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" id="pw2" class="form-control" placeholder="Repetí tu contraseña" required minlength="8">
              </div>
              <div class="mb-3 small text-muted" style="line-height:1.5">
                Debe tener: <strong>8+</strong> caracteres, <strong>1 mayúscula</strong>, <strong>1 número</strong>
              </div>
              <div id="pwMatch" class="small d-none mb-2"></div>
              <div id="errorMsg" class="alert alert-danger d-none py-2 small"></div>
              <div id="successMsg" class="alert alert-success d-none py-2 small"></div>
              <button type="submit" class="btn btn-primary w-100" id="btnReset">Guardar contraseña</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const pw1 = document.getElementById('pw1');
    const pw2 = document.getElementById('pw2');
    const pwMatch = document.getElementById('pwMatch');
    function checkMatch() {
      if (pw2.value && pw1.value !== pw2.value) {
        pwMatch.textContent = 'Las contraseñas no coinciden';
        pwMatch.className = 'small mb-2 text-danger';
      } else if (pw2.value && pw1.value === pw2.value) {
        pwMatch.textContent = 'Las contraseñas coinciden ✓';
        pwMatch.className = 'small mb-2 text-success';
      } else {
        pwMatch.className = 'small d-none mb-2';
      }
    }
    pw1.addEventListener('input', checkMatch);
    pw2.addEventListener('input', checkMatch);
    document.getElementById('resetForm').addEventListener('submit', async e => {
      e.preventDefault();
      const pw1Val = document.getElementById('pw1').value;
      const pw2Val = document.getElementById('pw2').value;
      const errEl = document.getElementById('errorMsg');
      const okEl = document.getElementById('successMsg');
      errEl.classList.add('d-none');
      okEl.classList.add('d-none');
      if (pw1Val !== pw2Val) {
        errEl.textContent = 'Las contraseñas no coinciden';
        errEl.classList.remove('d-none');
        return;
      }
      const btn = document.getElementById('btnReset');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
      try {
        const r = await fetch('/api/usuario/reset/{{ token }}', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ nueva: pw1Val })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error);
        okEl.innerHTML = 'Contraseña actualizada. <a href="/login">Iniciar sesión →</a>';
        okEl.classList.remove('d-none');
        document.getElementById('resetForm').reset();
        pwMatch.className = 'small d-none mb-2';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
