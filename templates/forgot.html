<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Recuperar contraseña</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=7">
</head>
<body class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="auth-card">
          <div class="card-body">
            <div class="text-center mb-4">
              <div class="auth-brand">Infia</div>
              <p class="auth-subtitle mt-1">Recuperar contraseña</p>
            </div>
            <p class="text-center text-muted small mb-3">No te preocupes, es normal olvidarla. Ingresá tu email y generamos una nueva.</p>
            <form id="forgotForm">
              <div class="mb-3">
                <label class="form-label">Email con el que te registraste</label>
                <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
              </div>
              <div id="errorMsg" class="alert alert-danger d-none py-2 small"></div>
              <div id="successMsg" class="alert alert-success d-none py-2 small"></div>
              <button type="submit" class="btn btn-primary w-100" id="btnSolicitar">Generar link de recuperación</button>
            </form>
            <hr>
            <p class="text-center small mb-0">
              <a href="/login" class="text-muted">← Volver a iniciar sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errEl = document.getElementById('errorMsg');
      const okEl = document.getElementById('successMsg');
      errEl.classList.add('d-none');
      okEl.classList.add('d-none');
      const btn = document.getElementById('btnSolicitar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generando...';
      try {
        const r = await fetch('/api/usuario/reset-solicitar', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error);
        if (data.reset_link) {
          okEl.innerHTML = `
            <div class="mb-2">Link generado con éxito:</div>
            <a href="${data.reset_link}" class="btn btn-sm btn-outline-success w-100">Abrir para crear nueva contraseña</a>
            <div class="mt-2 small text-muted">Si no podés hacer clic, copiá esta dirección: <code>${data.reset_link}</code></div>`;
        } else {
          okEl.textContent = data.mensaje || 'Si el email existe, revisá tu correo.';
        }
        okEl.classList.remove('d-none');
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Generar link de recuperación';
      }
    });
  </script>
</body>
</html>
