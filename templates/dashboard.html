<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Panel</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=5">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark shadow-sm sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/dashboard">Infia</a>
      <div class="nav-links">
        <a class="nav-link-item active" href="/dashboard">Alumnos</a>
        <a class="nav-link-item" href="/actividades">Actividades</a>
        <a class="nav-link-item" href="/unidades">Unidades</a>
        <span class="nav-divider"></span>
        <a class="nav-link-item" href="/perfil">Perfil</a>
        <a class="nav-link-item" href="/config">Config</a>
        <span class="nav-divider"></span>
        <button class="nav-link-logout" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3" style="max-width:800px">
    <!-- Stats -->
    <div class="row g-2 mb-3 stats-row">
      <div class="col-3"><div class="card p-2"><div class="fs-5 fw-bold text-primary" id="statAlumnos">-</div><div class="small text-muted">Alumnos</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5 fw-bold text-success" id="statObsHoy">-</div><div class="small text-muted">Hoy</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5 fw-bold" style="color:var(--accent)" id="statTotalObs">-</div><div class="small text-muted">Total</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5 fw-bold" style="color:var(--primary-light)" id="statInformes">-</div><div class="small text-muted">Informes</div></div></div>
    </div>

    <!-- Tabs: Alumnos / Observaciones de hoy -->
    <ul class="nav nav-tabs mb-3" id="dashboardTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="alumnos">Alumnos</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="obsHoy">Observaciones de hoy</button></li>
    </ul>

    <!-- Alumnos tab -->
    <div id="tabAlumnos">
      <div class="section-header">
        <h6>Mis alumnos</h6>
        <button class="btn btn-sm btn-primary fw-bold" onclick="mostrarModalAlumno()">+ Agregar</button>
      </div>
      <div id="alumnosContainer"><div class="text-center py-4 text-muted">Cargando...</div></div>
    </div>

    <!-- Observaciones hoy tab -->
    <div id="tabObsHoy" style="display:none">
      <div class="section-header"><h6>Observaciones del día</h6></div>
      <div id="obsHoyContainer"><div class="text-center py-4 text-muted">Cargando...</div></div>
    </div>
  </div>

  <!-- Modal: Agregar alumno -->
  <div class="modal fade" id="modalAlumno" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title fw-bold">Nuevo alumno</h6>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formAlumno">
            <div class="mb-2">
              <label class="form-label">Nombre</label>
              <input type="text" id="aNombre" class="form-control" required>
            </div>
            <div class="mb-2">
              <label class="form-label">Apellido</label>
              <input type="text" id="aApellido" class="form-control" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-sm btn-primary fw-bold" onclick="guardarAlumno()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      cargarDashboard();
      document.querySelectorAll('#dashboardTabs .nav-link').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#dashboardTabs .nav-link').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const isObs = tab.dataset.tab === 'obsHoy';
          document.getElementById('tabAlumnos').style.display = isObs ? 'none' : '';
          document.getElementById('tabObsHoy').style.display = isObs ? '' : 'none';
        });
      });
    });
    async function guardarAlumno() {
      const n = document.getElementById('aNombre').value.trim();
      const a = document.getElementById('aApellido').value.trim();
      if (!n || !a) return mostrarToast('Completá nombre y apellido', 'warning');
      try {
        await api('POST', '/api/alumnos', { nombre: n, apellido: a });
        bootstrap.Modal.getInstance(document.getElementById('modalAlumno')).hide();
        mostrarToast('Alumno agregado');
        cargarAlumnos();
        cargarStats();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }
  </script>
</body>
</html>
