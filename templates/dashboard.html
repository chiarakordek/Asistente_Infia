<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Panel</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=7">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark shadow-sm sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/dashboard">Infia</a>
      <div class="nav-links">
        <a class="nav-link-item active" href="/dashboard">Alumnos</a>
        <a class="nav-link-item" href="/actividades">Actividades</a>
        <a class="nav-link-item" href="/areas">Áreas</a>
        <a class="nav-link-item" href="/unidades">Unidades</a>
        <span class="nav-divider"></span>
        <a class="nav-link-item" href="/perfil">Perfil</a>
        <span class="nav-divider"></span>
        <button class="nav-link-logout" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3" style="max-width:800px">
    <!-- Stats -->
    <div class="row g-2 mb-3 stats-row">
      <div class="col-3"><div class="card p-2"><div class="fs-5 text-primary" id="statAlumnos">-</div><div class="small text-muted">Alumnos</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5 text-success" id="statObsHoy">-</div><div class="small text-muted">Hoy</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5" style="color:var(--accent)" id="statTotalObs">-</div><div class="small text-muted">Total</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5" style="color:var(--primary-light)" id="statInformes">-</div><div class="small text-muted">Informes</div></div></div>
    </div>

    <!-- Tabs: Alumnos / Observaciones de hoy -->
    <ul class="nav nav-tabs mb-3" id="dashboardTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="alumnos">Alumnos</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="obsHoy">Observaciones de hoy</button></li>
    </ul>

    <!-- Alumnos tab -->
    <div id="tabAlumnos">
      <div class="section-header">
        <h6>Mis alumnos</h6>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-outline-primary" onclick="cargarVarios()">+ Varios</button>
          <button class="btn btn-sm btn-primary" onclick="mostrarModalAlumno()">+ Agregar</button>
        </div>
      </div>
      <div id="alumnosContainer"><div class="text-center py-4 text-muted">Cargando...</div></div>
    </div>

    <!-- Observaciones hoy tab -->
    <div id="tabObsHoy" style="display:none">
      <div class="section-header"><h6>Observaciones del día</h6></div>
      <div id="obsHoyContainer"><div class="text-center py-4 text-muted">Cargando...</div></div>
    </div>
  </div>

  <!-- Modal: Agregar 1 alumno -->
  <div class="modal fade" id="modalAlumno" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Nuevo alumno</h6>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label">Nombre</label>
            <input type="text" id="aNombre" class="form-control">
          </div>
          <div class="mb-2">
            <label class="form-label">Apellido</label>
            <input type="text" id="aApellido" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-sm btn-primary" onclick="guardarAlumno()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Agregar varios -->
  <div class="modal fade" id="modalVarios" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Agregar varios alumnos</h6>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="small text-muted mb-2">Un alumno por línea. Formato: <code>Nombre Apellido</code></p>
          <textarea id="listaAlumnos" class="form-control" rows="8" placeholder="Juan Pérez&#10;María López&#10;Carlos García"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button class="btn btn-sm btn-primary" onclick="guardarVarios()">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=5"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      cargarDashboard();
      document.querySelectorAll('#dashboardTabs .nav-link').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#dashboardTabs .nav-link').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const isObs = tab.dataset.tab === 'obsHoy';
          document.getElementById('tabAlumnos').style.display = isObs ? 'none' : '';
          document.getElementById('tabObsHoy').style.display = isObs ? '' : 'none';
        });
      });
    });

    let modalAlumno, modalVarios;

    document.addEventListener('DOMContentLoaded', () => {
      modalAlumno = new bootstrap.Modal('#modalAlumno');
      modalVarios = new bootstrap.Modal('#modalVarios');
    });

    function mostrarModalAlumno() {
      document.getElementById('aNombre').value = '';
      document.getElementById('aApellido').value = '';
      modalAlumno.show();
    }

    async function guardarAlumno() {
      const nombre = document.getElementById('aNombre').value.trim();
      const apellido = document.getElementById('aApellido').value.trim();
      if (!nombre || !apellido) return mostrarToast('Completá nombre y apellido', 'warning');
      try {
        await api('POST', '/api/alumnos', { nombre, apellido });
        modalAlumno.hide();
        mostrarToast('Alumno agregado');
        cargarAlumnos();
        cargarStats();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }

    function cargarVarios() {
      document.getElementById('listaAlumnos').value = '';
      modalVarios.show();
    }

    async function guardarVarios() {
      const lines = document.getElementById('listaAlumnos').value.trim().split('\n').filter(Boolean);
      if (!lines.length) return mostrarToast('Pegá al menos un alumno', 'warning');
      const alumnos = [];
      for (const l of lines) {
        const partes = l.trim().split(/\s+/);
        if (partes.length < 2) continue;
        const apellido = partes.pop();
        const nombre = partes.join(' ');
        alumnos.push({ nombre, apellido });
      }
      if (!alumnos.length) return mostrarToast('Formato: Nombre Apellido (uno por línea)', 'warning');
      try {
        await api('POST', '/api/alumnos/multi', { alumnos });
        modalVarios.hide();
        mostrarToast(alumnos.length + ' alumno(s) cargado(s)');
        cargarAlumnos();
        cargarStats();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }
  </script>
</body>
</html>
