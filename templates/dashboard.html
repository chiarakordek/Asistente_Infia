<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Panel</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=6">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark shadow-sm sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/dashboard">Infia</a>
      <div class="nav-links">
        <a class="nav-link-item active" href="/dashboard">Alumnos</a>
        <a class="nav-link-item" href="/actividades">Actividades</a>
        <a class="nav-link-item" href="/unidades">Unidades</a>
        <span class="nav-divider"></span>
        <a class="nav-link-item" href="/perfil">Perfil</a>
        <a class="nav-link-item" href="/config">Config</a>
        <span class="nav-divider"></span>
        <button class="nav-link-logout" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3" style="max-width:800px">
    <!-- Stats -->
    <div class="row g-2 mb-3 stats-row">
      <div class="col-3"><div class="card p-2"><div class="fs-5 text-primary" id="statAlumnos">-</div><div class="small text-muted">Alumnos</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5 text-success" id="statObsHoy">-</div><div class="small text-muted">Hoy</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5" style="color:var(--accent)" id="statTotalObs">-</div><div class="small text-muted">Total</div></div></div>
      <div class="col-3"><div class="card p-2"><div class="fs-5" style="color:var(--primary-light)" id="statInformes">-</div><div class="small text-muted">Informes</div></div></div>
    </div>

    <!-- Tabs: Alumnos / Observaciones de hoy -->
    <ul class="nav nav-tabs mb-3" id="dashboardTabs">
      <li class="nav-item"><button class="nav-link active" data-tab="alumnos">Alumnos</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="obsHoy">Observaciones de hoy</button></li>
    </ul>

    <!-- Alumnos tab -->
    <div id="tabAlumnos">
      <div class="section-header">
        <h6>Mis alumnos</h6>
      </div>

      <div class="card p-3 mb-3" id="addAlumnosCard">
        <div id="alumnoRows"></div>
        <button class="btn btn-sm btn-outline-primary mt-1" onclick="agregarFilaAlumno()">+ Agregar alumno</button>
        <div class="d-flex gap-2 mt-3">
          <button class="btn btn-sm btn-outline-secondary flex-grow-1" onclick="limpiarAlumnos()">Limpiar</button>
          <button class="btn btn-sm btn-primary flex-grow-1" onclick="guardarAlumnos()">Guardar</button>
        </div>
      </div>

      <div id="alumnosContainer"><div class="text-center py-4 text-muted">Cargando...</div></div>
    </div>

    <!-- Observaciones hoy tab -->
    <div id="tabObsHoy" style="display:none">
      <div class="section-header"><h6>Observaciones del día</h6></div>
      <div id="obsHoyContainer"><div class="text-center py-4 text-muted">Cargando...</div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      cargarDashboard();
      agregarFilaAlumno();
      document.querySelectorAll('#dashboardTabs .nav-link').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#dashboardTabs .nav-link').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const isObs = tab.dataset.tab === 'obsHoy';
          document.getElementById('tabAlumnos').style.display = isObs ? 'none' : '';
          document.getElementById('tabObsHoy').style.display = isObs ? '' : 'none';
        });
      });
    });

    function agregarFilaAlumno() {
      const d = document.createElement('div');
      d.className = 'row g-1 mb-2 align-items-end alumno-add-row';
      d.innerHTML = `
        <div class="col-5">
          <input type="text" class="form-control form-control-sm al-nombre" placeholder="Nombre">
        </div>
        <div class="col-5">
          <input type="text" class="form-control form-control-sm al-apellido" placeholder="Apellido">
        </div>
        <div class="col-2 text-end">
          <button class="btn btn-sm btn-outline-danger btn-icon" onclick="this.closest('.alumno-add-row').remove()" title="Quitar">✕</button>
        </div>`;
      document.getElementById('alumnoRows').appendChild(d);
    }

    function limpiarAlumnos() {
      document.getElementById('alumnoRows').innerHTML = '';
      agregarFilaAlumno();
    }

    async function guardarAlumnos() {
      const alumnos = [];
      document.querySelectorAll('.alumno-add-row').forEach(row => {
        const nombre = row.querySelector('.al-nombre').value.trim();
        const apellido = row.querySelector('.al-apellido').value.trim();
        if (nombre && apellido) alumnos.push({ nombre, apellido });
      });
      if (!alumnos.length) return mostrarToast('Completá al menos un alumno', 'warning');
      try {
        await api('POST', '/api/alumnos/multi', { alumnos });
        mostrarToast(alumnos.length + ' alumno(s) guardado(s)');
        limpiarAlumnos();
        cargarAlumnos();
        cargarStats();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }
  </script>
</body>
</html>
