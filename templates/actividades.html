<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Actividades</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=5">
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark shadow-sm sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="/dashboard">Infia</a>
      <div class="nav-links">
        <a class="nav-link-item" href="/dashboard">Alumnos</a>
        <a class="nav-link-item active" href="/actividades">Actividades</a>
        <a class="nav-link-item" href="/areas">Áreas</a>
        <a class="nav-link-item" href="/unidades">Unidades</a>
        <span class="nav-divider"></span>
        <a class="nav-link-item" href="/perfil">Perfil</a>
        <span class="nav-divider"></span>
        <button class="nav-link-logout" onclick="logout()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-3" style="max-width:800px">
    <div class="section-header mb-3">
      <h6>Crear actividades</h6>
    </div>

    <div class="card p-3 mb-3">
      <div id="actRows"></div>

      <div class="d-flex gap-2 mt-2">
        <button class="btn btn-sm btn-outline-primary flex-grow-1" onclick="agregarFila()">+ Agregar actividad</button>
      </div>

      <hr class="my-3">

      <div class="mb-2">
        <label class="form-label">Asociar a unidad (opcional)</label>
        <select id="actUnidad" class="form-select form-select-sm">
          <option value="">— Sin unidad —</option>
          {% for u in unidades %}
          <option value="{{ u.id_unidad }}">{{ u.titulo }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-sm btn-outline-secondary flex-grow-1" onclick="limpiarTodo()">Limpiar</button>
        <button class="btn btn-sm btn-primary flex-grow-1" onclick="guardarActividades()">Guardar</button>
      </div>
    </div>

    <div class="section-header">
      <h6>Actividades de hoy</h6>
    </div>
    <div id="actHoyContainer"><div class="text-center py-4 text-muted small">Cargando...</div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=4"></script>
  <script>
    const areas = {{ areas | tojson }};

    document.addEventListener('DOMContentLoaded', () => {
      agregarFila();
      cargarActividades();
    });

    function agregarFila() {
      const d = document.createElement('div');
      d.className = 'row g-1 mb-2 align-items-end act-row';
      d.innerHTML = `
        <div class="col-7">
          <input type="text" class="form-control form-control-sm act-nombre" placeholder="Nombre de la actividad">
        </div>
        <div class="col-4">
          <select class="form-select form-select-sm act-area">
            <option value="" selected disabled>Seleccionar área</option>
            ${areas.map(a => `<option value="${a.nombre}">${a.nombre}</option>`).join('')}
          </select>
        </div>
        <div class="col-1 text-end">
          <button class="btn btn-sm btn-outline-danger btn-icon" onclick="this.closest('.act-row').remove()" title="Quitar">✕</button>
        </div>`;
      document.getElementById('actRows').appendChild(d);
    }

    function limpiarTodo() {
      document.getElementById('actRows').innerHTML = '';
      agregarFila();
    }

    async function guardarActividades() {
      const unidad = document.getElementById('actUnidad').value || null;
      const actividades = [];
      document.querySelectorAll('.act-row').forEach(row => {
        const nombre = row.querySelector('.act-nombre').value.trim();
        const area = row.querySelector('.act-area').value;
        if (nombre) actividades.push({ nombre, area });
      });
      if (!actividades.length) return mostrarToast('Escribí al menos una actividad', 'warning');
      try {
        await api('POST', '/api/actividades/multi', { actividades, id_unidad: unidad ? parseInt(unidad) : null });
        mostrarToast(actividades.length + ' actividad(es) guardada(s)');
        limpiarTodo();
        cargarActividades();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }

    async function cargarActividades() {
      try {
        const acts = await api('GET', '/api/actividades');
        const c = document.getElementById('actHoyContainer');
        if (!acts.length) {
          c.innerHTML = '<div class="text-center py-4 text-muted small">No hay actividades hoy</div>';
          return;
        }
        c.innerHTML = acts.map(a => `
          <div class="actividad-card">
            <div>
              <span>${a.nombre}</span>
              <span class="text-muted small ms-1">${a.area}</span>
              ${a.unidad_titulo ? `<span class="badge bg-light text-muted ms-1" style="font-size:0.65rem">${a.unidad_titulo}</span>` : ''}
            </div>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-outline-secondary btn-icon" onclick="editarActividad(${a.id_actividad},'${a.nombre.replace(/'/g,"\\'")}','${a.area.replace(/'/g,"\\'")}')" title="Editar">✏️</button>
              <button class="btn btn-sm btn-outline-danger btn-icon" onclick="eliminarActividad(${a.id_actividad})" title="Eliminar">✕</button>
            </div>
          </div>
        `).join('');
      } catch (e) {}
    }

    async function editarActividad(id, nombre, area) {
      const nuevoNombre = prompt('Nombre de la actividad:', nombre);
      if (!nuevoNombre) return;
      try {
        await api('PUT', '/api/actividades/' + id, { nombre: nuevoNombre, area });
        mostrarToast('Actividad actualizada');
        cargarActividades();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }

    async function eliminarActividad(id) {
      if (!confirm('¿Eliminar esta actividad?')) return;
      try {
        await api('DELETE', '/api/actividades/' + id);
        mostrarToast('Actividad eliminada');
        cargarActividades();
      } catch (e) { mostrarToast('Error: ' + e.message, 'danger'); }
    }
  </script>
</body>
</html>
