<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Infia - Crear cuenta</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=5">
</head>
<body class="auth-page">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        <div class="auth-card">
          <div class="card-body">
            <div class="text-center mb-4">
              <div class="auth-brand">Infia</div>
              <p class="auth-subtitle mt-1">Crear cuenta de docente</p>
            </div>
            <form id="registerForm" novalidate>
              <div class="mb-2">
                <label class="form-label">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" placeholder="Tu nombre" required>
                <div class="invalid-feedback">El nombre es obligatorio</div>
              </div>
              <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
                <div class="invalid-feedback">Ingresá un email válido</div>
              </div>
              <div class="mb-2">
                <label class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-control" placeholder="Mín. 8 caracteres" required minlength="8" autocomplete="new-password">
                <div class="invalid-feedback">8+ caracteres, 1 mayúscula, 1 número</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Confirmar contraseña</label>
                <input type="password" id="password2" class="form-control" placeholder="Repetí tu contraseña" required autocomplete="new-password">
                <div class="invalid-feedback">Las contraseñas no coinciden</div>
              </div>
              <div class="row g-2 mb-3">
                <div class="col-6">
                  <label class="form-label">Sala</label>
                  <select id="sala" class="form-select">
                    <option>3 Años A</option><option>3 Años B</option><option>3 Años C</option>
                    <option>4 Años A</option><option>4 Años B</option><option>4 Años C</option>
                    <option>5 Años A</option><option>5 Años B</option><option>5 Años C</option>
                  </select>
                </div>
                <div class="col-6">
                  <label class="form-label">Turno</label>
                  <select id="turno" class="form-select">
                    <option>Mañana</option>
                    <option selected>Tarde</option>
                  </select>
                </div>
              </div>
              <div id="errorMsg" class="alert alert-danger d-none py-2 small"></div>
              <button type="submit" class="btn btn-primary w-100 fw-bold">Crear cuenta</button>
            </form>
            <hr>
            <p class="text-center small mb-0">
              ¿Ya tenés cuenta? <a href="/login" class="fw-semibold">Iniciar sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/app.js?v=4"></script>
</body>
</html>
