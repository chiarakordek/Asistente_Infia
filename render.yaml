services:
  - type: web
    name: asistente-informes
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "0"
  - type: cron
    name: asistente-informes-limpieza
    env: python
    schedule: "0 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/procesar_bajas.py
    envVars:
      - key: DATABASE_URL
        sync: false
